name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core — test & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: cargo test
        run: cargo test -p espro-core --features bridge
      - name: cargo clippy
        run: cargo clippy -p espro-core --features bridge --all-targets

  ui:
    name: ui — syntax & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bridge
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The UI ships unbundled ES modules straight to the WebView — nothing else would
      # catch a syntax error or a mistyped import before an operator hits a blank page.
      - name: parse modules and resolve imports
        run: node tools/check-ui.mjs

      # Static checks cannot see a call to something that was never imported at all.
      # Rendering every page against the real core does — and it has to render pages with
      # data in them, or every page just draws "No cluster selected" and proves nothing.
      - name: build the dev bridge
        run: cargo build -p espro-core --features bridge --bin espro-bridge

      # Hosted mode is a security boundary: a request without the proxy's identity header
      # must be refused, and every write must be audited under the user's name. Checked
      # black-box against the real binary.
      - name: hosted-mode contract
        run: tools/hosted-check.sh

      - name: render every page against a mock cluster
        run: |
          npm install --no-save --no-fund --no-audit jsdom

          node tools/mock-es.mjs 9299 &
          until curl -sf http://127.0.0.1:9299/_cluster/health >/dev/null; do sleep 1; done

          ./target/debug/espro-bridge ui 8765 &
          until curl -sf -X POST http://127.0.0.1:8765/bridge \
            -H 'content-type: application/json' -d '{"type":"PING"}' >/dev/null; do sleep 1; done

          node tools/render-check.mjs --config tools/render-fixture.json

  # The Linux deployment is a Dockerfile and a compose stack, and nothing else in CI
  # touches either — a broken build or a hole in the auth gate would have been found by
  # whoever deployed it next. This builds the image and runs the trial, which asserts the
  # four properties the deployment exists for: 401 without credentials, the UI and the
  # bridge over TLS with them, a write audited under the signed-in user's name, and the
  # core with no host port binding and unreachable from outside the compose network.
  hosted:
    name: hosted stack — image & compose trial
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: build the image and trial the stack
        run: deploy/trial.sh
      - name: what the containers logged
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --tail 60
      - name: stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cargo audit is run directly rather than through rustsec/audit-check, because that
      # action takes its exclusions as a workflow input and ignores .cargo/audit.toml.
      # Running the tool itself keeps one file as the source of truth for what is accepted
      # and why, and makes a local `cargo audit` agree with CI exactly.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
