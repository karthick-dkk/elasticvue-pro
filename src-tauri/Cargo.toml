[package]
name = "elasticvue-pro"
version.workspace = true
edition.workspace = true
description = "ElasticVue Pro — multi-cluster Elasticsearch dashboard, direct or through a jump host"
default-run = "elasticvue-pro"

[lib]
name = "elasticvue_pro_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
espro-core = { path = "../crates/espro-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
