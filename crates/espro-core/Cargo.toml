[package]
name = "espro-core"
version.workspace = true
edition.workspace = true
description = "ElasticVue Pro desktop core: read-only ES transport, TLS pinning, SSH jump-host tunnels"

[lib]
path = "src/lib.rs"

[[bin]]
name = "espro-bridge"
path = "src/bin/bridge.rs"
required-features = ["bridge"]

[features]
default = ["vault"]
vault = ["dep:keyring"]
bridge = ["dep:axum", "dep:tower-http"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
rustls-pki-types = "1"
x509-parser = "0.16"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2", "legacy-ed25519-pkcs8-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
dirs = "6"
hex = "0.4"
rand = "0.8"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native"] }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs", "cors"] }
