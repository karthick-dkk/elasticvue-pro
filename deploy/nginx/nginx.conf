# ElasticVue Pro — the front door. TLS, the auth gate, and the only path to the core.
events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Access log in a shape a collector can parse; the core's audit log is separate.
  log_format main escape=json
    '{"time":"$time_iso8601","user":"$remote_user","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"ms":$request_time,"ua":"$http_user_agent"}';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Plain HTTP is never served; there is nothing to redirect because 80 is not exposed.
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- the auth gate (phase 1: HTTP basic against htpasswd) ----------------------
    # Replace this block with oauth2-proxy / your IdP for SSO; the core does not change,
    # it only needs X-Auth-User to be set by something it can trust.
    auth_basic           "ElasticVue Pro";
    auth_basic_user_file /etc/nginx/htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
      proxy_pass         http://core:8765;
      proxy_http_version 1.1;
      proxy_read_timeout 120s;     # a long snapshot _status can take a while
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      # The identity the core trusts. Set here, after auth, and nowhere else.
      proxy_set_header   X-Auth-User $remote_user;
      # Never let a client supply it.
      proxy_hide_header  X-Auth-User;
    }
  }
}
