# ElasticVue Pro, hosted. One exposed port: nginx on 443.
#
#   cp .env.example .env            # then edit
#   docker compose up -d --build
#
# Signing in is the app's own job now — the first run asks for an administrator. Edge
# authentication is optional: make-htpasswd.sh and the htpasswd mount are still here so
# re-enabling auth_basic in nginx.conf is a two-line change, not a rebuild.
# The core is reachable ONLY through nginx. Never publish port 8765.
services:
  core:
    # Defaults to a locally built image, so `docker compose up --build` works on a clone
    # with no registry access at all. Set ESPRO_IMAGE to a published tag —
    # karthickdk02/elasticvue-pro-core:2.2.9 — and compose pulls it instead, which is
    # what turns a twenty-minute Rust build on a small server into a download.
    image: ${ESPRO_IMAGE:-elasticvue-pro-core:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ESPRO_BIND: 0.0.0.0
      ESPRO_DATA_DIR: /app/data
      ELASTICVUE_CONFIG: /app/config/config_cluster.json
      RUST_LOG: info,audit=info
    volumes:
      # Writable, because adding a cluster from the Config page is the normal way to set
      # this up and a fresh install has no other way to do it — the read-only mount it
      # replaced turned "Add cluster" into "Read-only file system (os error 30)".
      #
      # It is not a hole: CONFIG_WRITE is admin-only (auth.rs), the core already holds
      # these credentials in memory, and the directory is owned by the container's uid
      # with the host user's group, so both can edit it. Secrets in it stay sealed.
      - ./config:/app/config           # config_cluster.json, secrets sealed
      - core-data:/app/data            # pins.json — trust decisions
      - ${SSH_KEYS_DIR:-./ssh}:/app/ssh:ro   # jump-host keys, read-only
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [core]
    ports:
      - "${LISTEN:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Unused while nginx.conf has no auth_basic; kept so turning it back on is a
      # config change rather than a compose change.
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./tls:/etc/nginx/tls:ro         # fullchain.pem + privkey.pem
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elasticvue
      POSTGRES_USER: elasticvue
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elasticvue"]
      interval: 10s

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  core-data:
  db-data:

networks:
  internal:
